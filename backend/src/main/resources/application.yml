server:
  port: 8080

spring:
  application:
    name: tvshop-backend
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tvshop}
    username: ${PGUSER:tvshop}
    password: ${PGPASSWORD:tvshop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Мониторинг (health-check)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-tvshop-0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000

# CORS (frontend dev server)
app.cors.allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Uploads (загружаемые изображения)
app.uploads.dir: ${UPLOADS_DIR:uploads}

# Публичный адрес бэкенда (для деплоя). Пусто = картинки остаются относительными.
app.base-url: ${BASE_URL:}

# Публичный адрес сайта (для sitemap.xml / robots.txt)
app.site-url: ${SITE_URL:}

# Отправитель писем (восстановление пароля)
app.mail.from: ${MAIL_FROM:}

# AI-генерация описаний (DeepSeek / OpenAI-совместимый API)
app.ai:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 20MB

logging:
  level:
    org.hibernate.SQL: warn
