# Производственный профиль: активируется через SPRING_PROFILES_ACTIVE=prod
server:
  # Учитывать X-Forwarded-* заголовки (за reverse-proxy Nginx/Caddy)
  forward-headers-strategy: framework

# Куки авторизации (httpOnly): в проде Secure + SameSite=None (кросс-домен Netlify→Render)
app.cookie.secure: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql: off
