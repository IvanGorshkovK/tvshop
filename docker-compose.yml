services:
  db:
    image: postgres:16-alpine
    container_name: tvshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tvshop}
      POSTGRES_USER: ${POSTGRES_USER:-tvshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tvshop} -d ${POSTGRES_DB:-tvshop}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
