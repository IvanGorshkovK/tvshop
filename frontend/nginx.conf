# HTTP → HTTPS (кроме ACME-челленджа для продления сертификата)
server {
    listen 80;
    server_name tvspace.shop www.tvspace.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name tvspace.shop www.tvspace.shop;

    ssl_certificate /etc/letsencrypt/live/tvspace.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tvspace.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # SPA: все маршруты фронтенда отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные изображения
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Мониторинг и SEO
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Кэш статики (файлы с хешами)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
